name: Corporate LMS CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-lint:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Kiểm tra Frontend (Next.js)
      - name: Install & Check Frontend
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install
            npm run lint --if-present
            npm run build --if-present
          fi

      # 2. Kiểm tra Backend (NestJS + Prisma + Unit Test Jest)
      - name: Install, Build & Unit Test Backend
        env:
          DATABASE_URL: "postgresql://lms_user:lms_password@localhost:5432/corporate_lms?schema=public"
        run: |
          if [ -d "backend" ]; then
            cd backend
            npm install
            npx prisma generate
            npm run build --if-present
            npm test -- --watchAll=false
          fi

      # 3. Kiểm thử Tự động E2E (Playwright)
      - name: Run Playwright E2E Tests
        run: |
          if [ -d "e2e" ]; then
            cd e2e
            npm install
            npx playwright install --with-deps chromium
            npm run test:e2e
          fi