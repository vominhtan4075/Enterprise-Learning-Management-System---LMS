name: Corporate LMS CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-lint:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_password
          POSTGRES_DB: corporate_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lms_user -d corporate_lms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: "development"
      PORT: "3000"
      DATABASE_URL: "postgresql://lms_user:lms_password@localhost:5432/corporate_lms?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "novatech_lms_super_secret_jwt_key_2026_min_32_chars"
      JWT_EXPIRES_IN: "86400"
      HRM_API_KEY: "hrm-secret-api-key-2026"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # 1. Kiểm tra Frontend (Install & Build)
      - name: Install, Lint & Build Frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3000/api/v1"
        run: |
          npm install --no-audit --no-fund
          npm run lint || true
          npm run build

      # 2. Cài đặt dependencies Backend
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install --no-audit --no-fund

      # 3. Chạy Lint Backend
      - name: Lint Backend Code
        working-directory: ./backend
        run: npm run lint

      # 4. Khởi tạo Prisma Client, Migrate CSDL & Nạp Seed Data
      - name: Generate Prisma Client, Run Migrations & Seed Database
        working-directory: ./backend
        run: |
          npx prisma generate --no-hints
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      # 5. Kiểm tra Build Backend
      - name: Build Backend Application
        working-directory: ./backend
        run: npx nest build

      # 6. Chạy toàn bộ Unit Tests Backend (Jest ESM)
      - name: Run Backend Unit Tests (Jest)
        working-directory: ./backend
        run: npm test

      # 7. Cài đặt Playwright và chạy thật 6/6 kịch bản E2E
      - name: Install & Run Playwright E2E Tests (6/6 Real Scenarios)
        run: |
          cd e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          BACKEND_URL=http://localhost:3000 npm run test:e2e

      # 8. Upload báo cáo Playwright E2E lên GitHub Actions Artifacts
      - name: Upload Playwright E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: e2e/playwright-report/
          retention-days: 7